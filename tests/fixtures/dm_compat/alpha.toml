    [[classes.keys]]
    id = "active"
    type = "bool"
    default = false
    helpers = true

[[classes]]
id = "devicecfg"
name = "deviceCfg"

    [[classes.keys]]
    id = "versionnumber"
    name = "versionNumber"
    type = "int32"
    default = 0
    helpers = true
    persistent = true
