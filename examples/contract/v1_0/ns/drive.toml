# A motion subsystem: desired settings, reported state, a struct key and a struct command.

[meta]
id = "drive"
namespace_id = 3

[enums.mode.values]
off = 0
eco = 1
sport = { value = 2, wire = "sportMode" }   # a wire string other than the name

[enums.mode.variants.sku_b]              # sku_b renames 1, adds 3, has no sport
remove = ["sport"]

[enums.mode.variants.sku_b.values]
saver = 1
turbo = 3

[enums.fan.values]                       # a shadowed enum: explicit wire strings, an inbound alias
quiet = { value = 0, wire = "quiet" }
normal = { value = 1, wire = "normal" }
boost = { value = 2, wire = "high", accept = ["max"] }   # reported "high"; "high" and "max" accepted

[enums.fan.variants.sku_b.values]        # sku_b calls 0 whisper and still accepts "quiet"
whisper = { value = 0, wire = "whisper", accept = ["quiet"] }

[enums.tone.values]                      # the wire strings a rendered index list selects
beep = { value = 0, wire = "beep" }
chime = { value = 1, wire = "chime" }

[enums.drive_outcome.values]             # the drive command's result outcomes (outcome = ...)
accepted = 0
refused = 1
busy = 2

[enums.drive_outcome.variants.sku_b.values]   # sku_b's approve verb can find its offer stale
stale_offer = 3

[[classes]]
id = "settings"
class_index = 0
role = "settings"
persistence = "durable"

[[classes.keys]]
id = "speed_limit"
key_index = 0
type = "uint16"
unit = "mm/s"
min = 0
max = 2000
step = 10
introduced_in = "1.0"
write_rate = "1/min"
default = 100
defaults = { sku_b = 80 }
shadow = "settings.speedLimit"
apply_group = "motion"
on_reject = "clear_desired"

[[classes.keys]]
id = "mode"
key_index = 1
type = "uint8"
enum = "mode"
introduced_in = "1.0"
write_rate = "1/min"
default = 1

[[classes.keys]]
id = "gain"
key_index = 2
type = "float32"
introduced_in = "1.0"
write_rate = "1/min"
default = 1.5
defaults = { sku_b = 0.75 }

[[classes.keys]]
id = "fan"
key_index = 5
type = "uint8"
enum = "fan"
introduced_in = "1.0"
write_rate = "1/min"
default = 1
shadow = "settings.fanSpeed"
apply_group = "motion"
inbound_unknown = "quiet"            # an unmatched string is quiet (code 0), as today
implies = [ { key = "drive.settings.speed_limit", value = 500 } ]

[[classes]]
id = "state"
class_index = 1
role = "state"
deferred_ms = 5000   # class default interval: odometer uses it, the other keys are not deferred

[[classes.keys]]
id = "speed"
key_index = 0
type = "int16"
introduced_in = "1.0"
write_rate = "10/s"
rate_burst = 20

[[classes.keys]]
id = "odometer"
key_index = 1
type = "uint32"
introduced_in = "1.0"
persistence = "deferred"
write_rate = "1/s"

[[classes.keys]]
id = "enabled"
key_index = 2
type = "bool"
introduced_in = "1.0"
default = false

[[classes.keys]]
id = "label"
key_index = 3
type = "string"
max_size = 32
introduced_in = "1.0"
default = "idle"

[[classes.keys]]
id = "error_overcurrent"
error = { group = "product", bit = 1 }
key_index = 4
type = "bool"
introduced_in = "1.0"
doc = "Error key: set and cleared by the integrator."

[[classes.keys]]
id = "error_dock_jam"
key_index = 6
type = "bool"
introduced_in = "1.0"
variants = ["sku_b"]                 # exists on sku_b only
error = { group = "dock", bit = 0 }
doc = "Dock error of sku_b (wire id e50)."

[[classes.keys]]
id = "fan_applied"
key_index = 7
type = "uint8"
enum = "fan"
introduced_in = "1.0"
shadow = ["state.fanSpeed", "settings.fanSpeed"]   # one STATE key at two reported paths
applies = "drive.settings.fan"
outbound_unknown = "normal"          # a code past the enum reports "normal"

[[classes.keys]]
id = "speed_limit_applied"
key_index = 8
type = "uint16"
introduced_in = "1.0"
shadow = "settings.speedLimit"
applies = "drive.settings.speed_limit"

[[classes.keys]]
id = "tones"
key_index = 10
type = "string"
max_size = 8
introduced_in = "1.0"
shadow = "state.tones"
render = { kind = "csv_index_list", enum = "tone", max_items = 4 }   # "0,1" reports ["beep","chime"]
telem = "tones"

[[classes.keys]]
id = "docked"
key_index = 11
type = "bool"
introduced_in = "1.0"
shadow = "state.docked"
forced = true                        # re-emitted on every delta
telem = "dock"

[[classes.keys]]
id = "trip_count"
key_index = 12
type = "uint32"
introduced_in = "1.0"
persistence = "durable"              # a durable key in a state class: one integrator batch spans
write_rate = "1/min"                 # durable, deferred (odometer, run_time) and volatile keys
doc = "Completed trips."

[[classes.keys]]
id = "run_time"
key_index = 13
type = "uint32"
introduced_in = "1.0"
persistence = "deferred"
deferred_ms = 60000                  # a second deferred interval next to the class's 5000
write_rate = "1/s"

[[classes]]
id = "map"
class_index = 2
role = "state"

[[classes.keys]]
id = "map_data"
key_index = 0
type = "struct"
max_size = 65536
introduced_in = "1.0"

[[classes]]
id = "command"
class_index = 3
role = "command"

[[classes.commands]]
id = "map_edit"
cmd_index = 0
result_index = 1
dedupe_index = 2
introduced_in = "1.0"
persistence = "durable"
owner = "app.map"
payload = "struct"
payload_max = 32768
result_max = 256
max_edits = 32
dedupe_ring = 8
write_rate = "1/min"

[[classes.commands]]
id = "drive"
cmd_index = 3
result_index = 4
dedupe_index = 5
introduced_in = "1.0"
persistence = "none"
owner = "integrator"
payload_max = 64
result_max = 16
dedupe_ring = 4
outcome = "drive_outcome"
doc = "A motion verb: go and stop; approve on sku_b."

[[classes.keys]]
id = "plan_epoch"
key_index = 6
type = "uint32"
introduced_in = "1.0"
doc = "Argument of approve."

[[classes.keys]]
id = "map_id"
key_index = 7
type = "uint16"
introduced_in = "1.0"

[[classes.keys]]
id = "area_id"
key_index = 8
type = "uint16"
introduced_in = "1.0"

[[classes.keys]]
id = "map_payload"
key_index = 9
type = "string"
max_size = 512
introduced_in = "1.0"
doc = "Base64 text of a map request, passed through as text."

# -- shadow wire mapping: how requests reach the commands ---------------------------
[[shadow_commands]]
topic = "command_topic"
selector = { field = "state", wire = "go" }
command = "drive.command.drive"

[[shadow_commands]]
topic = "command_topic"
selector = { field = "state", wire = "stop" }
command = "drive.command.drive"

[[shadow_commands]]                      # sku_b only: {"id":N,"state":"approve","offerEpoch":E}
topic = "command_topic"
variants = [ "sku_b" ]
grounded_in = "the sku_b library build"
selector = { field = "state", wire = "approve" }
command = "drive.command.drive"
args = [ { field = "offerEpoch", key = "drive.command.plan_epoch", absent = 0 } ]

[[shadow_commands]]                      # {"state":{...}}: an object state is a settings body
topic = "command_topic"
selector = { field = "state", object = true }
body = "settings"

[[shadow_commands]]                      # {"state":"settings",...}
topic = "command_topic"
selector = { field = "state", wire = "settings" }
body = "settings"

[[shadow_commands]]                      # {"state":"mapcmd","map":{"cmd":"saveMap","mapid":M}}
topic = "command_topic"
selector = { field = "state", wire = "mapcmd" }
body = { object = "map", selector = { field = "cmd", wire = "saveMap" } }
command = "drive.command.map_edit"
args = [ { field = "mapid", key = "drive.command.map_id", absent = 0 } ]

[[shadow_commands]]                      # {"id":N,"cmd":["saveMap",...],"mapid":M,"data":"<base64>"}
topic = "mapjob_topic"
protocol = "command_array"
selector = { field = "cmd", element = "saveMap" }
command = "drive.command.map_edit"
args = [
  { field = "mapid", key = "drive.command.map_id", absent = 0 },
  { field = "data", key = "drive.command.map_payload", omit_when_absent = true, encoding = "base64" },
]

[[shadow_commands]]                      # newMap cannot carry a map id
topic = "mapjob_topic"
protocol = "command_array"
selector = { field = "cmd", element = "newMap" }
command = "drive.command.map_edit"

[[shadow_commands]]
topic = "mapjob_topic"
protocol = "command_array"
selector = { field = "cmd", element = "splitArea" }
command = "drive.command.map_edit"
args = [
  { field = "mapid", key = "drive.command.map_id", absent = 0 },
  { field = "areaid", key = "drive.command.area_id", required = true, ec = 5 },
]
