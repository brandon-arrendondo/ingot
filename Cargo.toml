[package]
name = "ingot"
version = "1.0.0"
edition = "2021"
authors = ["Brandon Arrendondo"]
license = "MIT"
description = "Embedded database C code generator with compile-time perfect hashing"
repository = "https://github.com/brandon-arrendondo/ingot"
keywords = ["embedded", "codegen", "database", "kvp", "microcontroller"]
categories = ["command-line-utilities", "development-tools", "embedded"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tera = "1"
rand = "0.9"
serde_yaml = "0.9"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1

[package.metadata.deb]
maintainer = "Brandon Arrendondo"
section = "devel"
priority = "optional"
assets = [
    ["target/release/ingot", "usr/bin/", "755"],
    ["docs/ingot.1", "usr/share/man/man1/", "644"],
    ["templates/*", "usr/share/ingot/templates/", "644"],
    ["README.md", "usr/share/doc/ingot/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/ingot", dest = "/usr/bin/ingot", mode = "755" },
    { source = "docs/ingot.1", dest = "/usr/share/man/man1/ingot.1", mode = "644" },
    { source = "templates/*", dest = "/usr/share/ingot/templates/", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/ingot/README.md", mode = "644" },
]
