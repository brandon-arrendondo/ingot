name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install pre-commit and invoke
        run: pip install pre-commit invoke

      - name: Run pre-commit hooks (fmt + clippy + coverage gate)
        run: invoke check

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ingot-linux-x86_64
          path: target/release/ingot

  test:
    name: Test (Rust + C integration)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install invoke
        run: pip install invoke

      - name: Run all tests
        run: invoke test

  coverage:
    name: Coverage (Rust + C)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install invoke and gcovr
        run: pip install invoke gcovr

      - name: Run coverage
        run: invoke coverage

      - name: Upload Rust lcov
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: coverage/lcov.info

      - name: Upload C Cobertura XML reports
        uses: actions/upload-artifact@v4
        with:
          name: c-coverage-cobertura
          path: coverage/*.xml

      - name: Publish Cobertura coverage
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/*.xml
          format: markdown
          output: both
