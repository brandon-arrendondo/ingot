fail_fast: true
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-llvm-cov
        name: cargo llvm-cov (tests + 80% coverage gate)
        description: Run tests with coverage — fail if line coverage < 80%. Produces lcov.info.
        entry: bash -c 'scripts/coverage-gate.sh 80 2>&1'
        language: system
        pass_filenames: false
        verbose: true

      - id: agent-guard-tests
        name: agent and commit guard regression tests
        entry: python3 -W error::ResourceWarning -m unittest discover -s scripts -p 'test_check_*.py'
        language: system
        pass_filenames: false
        files: ^scripts/.*\.py$

  # Keep the hook's source scope and the checked-in baseline in sync. This
  # includes Rust source/tests and Python policy guards, excluding templates
  # (which contain Rust fragments) and model fixtures.
  # Args replace the hook defaults, so update the thresholds and baseline together.
  - repo: https://github.com/brandon-arrendondo/knots-pre-commit
    rev: v1.19.0
    hooks:
      - id: knots
        args:
          - --mccabe-threshold=15
          - --cognitive-threshold=15
          - --nesting-threshold=5
          - --sloc-threshold=50
          - --abc-threshold=20.0
          - --return-threshold=3
          - --aird-threshold=85
          - --baseline=.knots-baseline.json
        files: '^(src|tests)/.*\.rs$|^scripts/.*\.py$'
        exclude: '^tests/fixtures/'
        types_or: [rust, python]

  - repo: local
    hooks:
      - id: commit-message-policy
        name: DCO sign-off and no AI attribution trailers
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
