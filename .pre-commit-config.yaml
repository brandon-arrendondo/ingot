repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-llvm-cov
        name: cargo llvm-cov (tests + 80% coverage gate)
        description: Run tests with coverage — fail if line coverage < 80%. Produces lcov.info.
        entry: bash -c 'scripts/coverage-gate.sh 80 2>&1'
        language: system
        pass_filenames: false
        verbose: true
